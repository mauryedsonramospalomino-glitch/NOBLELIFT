<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión de Ventas Noblelift</title>
<style>
/* ===== Variables de diseño ===== */
:root{
  --c-primary:#1f3a5f; --c-primary-dark:#152a46; --c-primary-soft:#e8eef6;
  --c-accent:#d9822b; --c-accent-soft:#fbefe2;
  --c-bg:#f4f6f9; --c-surface:#ffffff; --c-border:#dde3ea;
  --c-text:#1d2733; --c-muted:#5f6b7a;
  --c-ok:#1e7a4f; --c-ok-soft:#e3f3ea;
  --c-warn:#9a6200; --c-warn-soft:#fdf2d9;
  --c-bad:#b42318; --c-bad-soft:#fdeceb;
  --radius:.6rem; --shadow:0 1px 3px rgba(20,35,55,.08);
  --sidebar-w:15rem;
  font-size:16px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.45}
h1,h2,h3{margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--c-primary)}

/* ===== Estructura general ===== */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.sidebar{background:var(--c-primary);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:1.25rem 1.25rem 1rem;border-bottom:1px solid rgba(255,255,255,.12)}
.brand strong{display:block;font-size:1.1rem;letter-spacing:.02em}
.brand span{font-size:.8rem;opacity:.75}
.nav{list-style:none;margin:0;padding:.75rem .5rem;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:.7rem;padding:.65rem .8rem;border-radius:.45rem;color:#dbe4ef;text-decoration:none;font-size:.95rem}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a[aria-current="page"]{background:#fff;color:var(--c-primary);font-weight:600}
.nav svg{width:1.15rem;height:1.15rem;flex:none}
.sidebar-foot{padding:.9rem 1.25rem;font-size:.75rem;opacity:.7}
.scrim{display:none}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.content{padding:1.5rem clamp(1rem,3vw,2.25rem) 3rem;max-width:90rem;width:100%}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.25rem}
.page-head h1{font-size:1.5rem}
.page-head p{margin:.25rem 0 0;color:var(--c-muted);font-size:.9rem}
.actions{display:flex;flex-wrap:wrap;gap:.5rem}

/* ===== Componentes ===== */
.card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.1rem 1.2rem}
.card h2{font-size:1rem;margin-bottom:.8rem}
.grid{display:grid;gap:1rem}
.kpis{grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));margin-bottom:1rem}
.kpi .label{font-size:.8rem;color:var(--c-muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .value{font-size:1.6rem;font-weight:700;margin-top:.25rem}
.kpi .sub{font-size:.82rem;color:var(--c-muted)}
.two-col{grid-template-columns:repeat(auto-fit,minmax(min(100%,24rem),1fr))}

.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--c-border);background:var(--c-surface);padding:.5rem .9rem;border-radius:.45rem;cursor:pointer;font-size:.9rem;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--c-primary)}
.btn-primary{background:var(--c-primary);border-color:var(--c-primary);color:#fff}
.btn-primary:hover{background:var(--c-primary-dark)}
.btn-accent{background:var(--c-accent);border-color:var(--c-accent);color:#fff}
.btn-danger{color:var(--c-bad);border-color:#f0c5c1}
.btn-sm{padding:.3rem .6rem;font-size:.8rem}
.btn-link{border:0;background:none;color:var(--c-primary);cursor:pointer;padding:0;font-weight:600;text-align:left}

.toolbar{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem;align-items:center}
.toolbar input[type=search]{flex:1 1 14rem}
.input,.toolbar input,.toolbar select,.form select,.form input,.form textarea{border:1px solid var(--c-border);border-radius:.45rem;padding:.5rem .65rem;background:#fff;min-width:0}
.input:focus,input:focus,select:focus,textarea:focus{outline:2px solid #9bb6d8;outline-offset:0;border-color:var(--c-primary)}
.btn:focus-visible,.nav a:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}

/* Tablas: scroll horizontal en móvil */
.table-wrap{overflow-x:auto;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:.6rem .75rem;text-align:left;border-bottom:1px solid var(--c-border);vertical-align:top}
th{background:#f8fafc;font-size:.76rem;text-transform:uppercase;letter-spacing:.04em;color:var(--c-muted);position:sticky;top:0;white-space:nowrap}
tbody tr:hover{background:#fafbfd}
td.num,th.num{text-align:right;white-space:nowrap}
.muted{color:var(--c-muted)}
.small{font-size:.8rem}
.empty{padding:2rem;text-align:center;color:var(--c-muted)}

.badge{display:inline-block;padding:.15rem .55rem;border-radius:999px;font-size:.75rem;font-weight:600;white-space:nowrap;background:var(--c-primary-soft);color:var(--c-primary)}
.badge.ok{background:var(--c-ok-soft);color:var(--c-ok)}
.badge.warn{background:var(--c-warn-soft);color:var(--c-warn)}
.badge.bad{background:var(--c-bad-soft);color:var(--c-bad)}
.badge.accent{background:var(--c-accent-soft);color:#94530f}
.badge.grey{background:#eef0f3;color:#55606e}

/* Embudo */
.funnel-row{display:grid;grid-template-columns:7.5rem 1fr 6.5rem;gap:.6rem;align-items:center;margin:.45rem 0;font-size:.88rem}
.bar{height:.85rem;background:#edf1f6;border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--c-primary);border-radius:999px}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(14rem,1fr));gap:.8rem;overflow-x:auto;padding-bottom:.5rem}
.kcol{background:#eef1f5;border-radius:var(--radius);padding:.7rem;min-height:10rem}
.kcol h3{font-size:.85rem;display:flex;justify-content:space-between;margin-bottom:.6rem}
.kcard{background:#fff;border:1px solid var(--c-border);border-radius:.5rem;padding:.6rem .7rem;margin-bottom:.55rem;cursor:pointer;font-size:.85rem}
.kcard:hover{border-color:var(--c-primary)}
.kcard strong{display:block}
.seg{display:inline-flex;border:1px solid var(--c-border);border-radius:.45rem;overflow:hidden}
.seg button{border:0;background:#fff;padding:.45rem .8rem;cursor:pointer;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--c-primary);color:#fff}

/* Listas simples */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:.75rem;padding:.55rem 0;border-bottom:1px solid var(--c-border);font-size:.88rem}
.list li:last-child{border-bottom:0}

/* Alertas y mapa de baterías */
.alert{border-radius:var(--radius);padding:.75rem 1rem;margin-bottom:1rem;font-size:.9rem;border:1px solid}
.alert.bad{background:var(--c-bad-soft);border-color:#f3b8b2;color:#7a1a12}
.alert.warn{background:var(--c-warn-soft);border-color:#f0d58c;color:#5e3c00}
.alert a{font-weight:600;color:inherit}
.nav-badge{margin-left:auto;min-width:1.4rem;text-align:center;font-size:.72rem;font-weight:700;padding:.1rem .4rem;border-radius:999px;color:#fff}
.nav-badge.bad{background:#d92d20}.nav-badge.warn{background:#dc8a00}
.bat-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.2rem,1fr));gap:.4rem}
.bat-chip{border:1px solid var(--c-border);border-left:4px solid;border-radius:.4rem;background:#fff;padding:.3rem .4rem;font-size:.75rem;font-weight:600;cursor:pointer;text-align:left;display:flex;flex-direction:column;line-height:1.2}
.bat-chip small{font-weight:400;color:var(--c-muted);font-size:.68rem}
.bat-chip.ok{border-left-color:var(--c-ok)}.bat-chip.warn{border-left-color:#dc8a00;background:var(--c-warn-soft)}.bat-chip.bad{border-left-color:#d92d20;background:var(--c-bad-soft)}
.bat-chip:hover{border-color:var(--c-primary)}

/* ===== Modal ===== */
dialog{border:0;border-radius:.8rem;padding:0;width:min(56rem,94vw);max-height:92vh;box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(15,25,40,.45)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.25rem;border-bottom:1px solid var(--c-border);position:sticky;top:0;background:#fff;z-index:2}
.modal-head h2{font-size:1.1rem}
.modal-body{padding:1.1rem 1.25rem;overflow:auto}
.modal-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.5rem;padding:.9rem 1.25rem;border-top:1px solid var(--c-border);position:sticky;bottom:0;background:#fff}
.icon-btn{border:0;background:none;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--c-muted)}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:.8rem 1rem}
.form label{display:flex;flex-direction:column;gap:.3rem;font-size:.8rem;font-weight:600;color:var(--c-muted)}
.form .full{grid-column:1/-1}
.form textarea{min-height:4.5rem;resize:vertical}
.section-title{grid-column:1/-1;font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;color:var(--c-primary);border-bottom:1px solid var(--c-border);padding-bottom:.3rem;margin-top:.4rem}

/* Líneas de cotización */
.lines td{padding:.4rem}
.lines input,.lines select{width:100%;border:1px solid var(--c-border);border-radius:.35rem;padding:.4rem}
.lines .qty{width:4.5rem}
.lines .pct{width:4.5rem}
.lines .price{width:7.5rem}
.totals{margin-left:auto;max-width:20rem;margin-top:.8rem;font-size:.92rem}
.totals div{display:flex;justify-content:space-between;padding:.25rem 0}
.totals .grand{font-weight:700;font-size:1.05rem;border-top:2px solid var(--c-text);margin-top:.3rem;padding-top:.45rem}

/* Documento de cotización imprimible */
.doc{font-size:.88rem;color:#111}
.doc-head{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;border-bottom:3px solid var(--c-primary);padding-bottom:.8rem;margin-bottom:1rem}
.doc-head h3{font-size:1.25rem;color:var(--c-primary)}
.doc table th{position:static}
.doc .cond{margin-top:1rem;font-size:.82rem}

.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--c-text);color:#fff;padding:.65rem 1.1rem;border-radius:.5rem;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}

/* ===== Responsive ===== */
@media (max-width: 900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0 auto 0 0;width:min(17rem,82vw);transform:translateX(-100%);transition:transform .2s;z-index:40}
  .sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
  .topbar{display:flex;align-items:center;gap:.75rem;padding:.7rem 1rem;background:var(--c-primary);color:#fff;position:sticky;top:0;z-index:30}
  .topbar button{background:none;border:0;color:#fff;font-size:1.5rem;cursor:pointer;line-height:1}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35;display:none}
  .scrim.show{display:block}
}
@media (max-width: 560px){
  .page-head h1{font-size:1.25rem}
  .kpis{grid-template-columns:1fr 1fr;gap:.6rem}
  .card{padding:.85rem .9rem}
  .kpi .value{font-size:1.35rem}
  .funnel-row{grid-template-columns:6rem 1fr 5rem;font-size:.8rem}
  /* Tablas como tarjetas en móvil */
  .table-wrap.stack table, .table-wrap.stack tbody, .table-wrap.stack tr, .table-wrap.stack td{display:block;width:100%}
  .table-wrap.stack thead{display:none}
  .table-wrap.stack tr{border-bottom:1px solid var(--c-border);padding:.5rem 0}
  .table-wrap.stack td{border:0;padding:.2rem .9rem;display:flex;justify-content:space-between;gap:1rem;text-align:right}
  .table-wrap.stack td::before{content:attr(data-label);font-weight:600;color:var(--c-muted);text-align:left;font-size:.78rem}
  .table-wrap.stack td.num{text-align:right}
}

/* ===== Impresión: solo el documento de cotización ===== */
@media print{
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{position:absolute;left:0;top:0;width:100%}
  dialog{box-shadow:none;max-height:none;width:100%}
}
</style>
</head>

    const realT = (+r.fobT || 0) + (+r.fleteT || 0) + (+r.seguroT || 0) + (+r.advT || 0) + (+r.gastosT || 0);
    const fobU = u ? (+r.fobT || 0) / u : 0, realU = u ? realT / u : 0;
    const alm = fobU * a.pAlmacen, mkt = fobU * a.pMkt;
    return {...r, realT, fobU, realU, alm, mkt, base: realU + alm + mkt};
  });
  // SERTEC se reparte entre los equipos en proporción a su costo (igual que el Cotizador Q1)
  const sumBase = rows.filter(r => r.tipo === 'Equipo').reduce((s, r) => s + r.unidades * r.base, 0);
  rows.forEach(r => {
    r.sertec = r.tipo === 'Equipo' && sumBase ? (+a.sertecMonto || 0) * r.base / sumBase : 0;
    r.costo = r.base + r.sertec; r.minimo = r.costo * (1 + (+a.margenMin || 0)); r.sugerido = r.costo * (1 + a.markup);
  });
  return rows;
}
function productCosting(p, d = db, ov = {}){
  const a = {...d.ajustes, ...ov};
  const sertecU = ov.sertecU ?? (p.sertecU || 0), real = p.costoReal || 0, fob = +p.fob || 0;
  const costo = real ? real + fob * (a.pAlmacen + a.pMkt) + sertecU
    : (+p.costo || (fob ? fob * (1 + a.pImport + a.pAlmacen + a.pMkt) * (1 + a.pSertec) : 0));
  return {real, costo, minimo: costo * (1 + (+a.margenMin || 0)), sugerido: costo * (1 + a.markup), sertecU, alm: fob * a.pAlmacen, mkt: fob * a.pMkt};
}
function applyCosteo(d = db){
  const g = {};
  costeoCalc(d).forEach(r => {
    if (!r.codigoCat || !r.unidades) return;
    const x = g[r.codigoCat] || (g[r.codigoCat] = {u: 0, real: 0, fob: 0, sertec: 0});
    x.u += r.unidades; x.real += r.realU * r.unidades; x.fob += r.fobU * r.unidades; x.sertec += r.sertec * r.unidades;
  });
  d.productos.forEach(p => {
    const x = g[p.codigo];
    if (x){ p.costoReal = x.real / x.u; p.fob = +(x.fob / x.u).toFixed(2); p.sertecU = x.sertec / x.u;
      const c = productCosting(p, d); p.costo = +c.costo.toFixed(2); if (!p.precio) p.precio = +c.sugerido.toFixed(2); }
    else { p.costoReal = 0; p.sertecU = 0; }
  });
}

function situacionMP(f){

}

function lineRow(it = {}){

function onLineProduct(sel){
  const p = prodById(sel.value); const tr = sel.closest('tr');
  if (p) tr.querySelector('[name=precio]').value = p.precio.toFixed(2);

function readLines(){
  return $$('#lines tbody tr').map(tr => {
    const p = prodById(tr.querySelector('[name=prod]').value);
    return p ? {productoId: p.id, modelo: p.modelo, specs: p.specs, stockRef: p.stockRef, cant: +tr.querySelector('[name=cant]').value || 1, precio: +tr.querySelector('[name=precio]').value || 0, desc: +tr.querySelector('[name=desc]').value || 0} : null;
  }).filter(Boolean);
}
function updateTotals(){
  let bajoMin = 0;
  $$('#lines tbody tr').forEach(tr => {
    const q = +tr.querySelector('[name=cant]').value || 0, pr = +tr.querySelector('[name=precio]').value || 0, d = +tr.querySelector('[name=desc]').value || 0;
    tr.querySelector('.line-total').textContent = usd(q * pr * (1 - d / 100));
    const p = prodById(tr.querySelector('[name=prod]').value), info = tr.querySelector('.stock-info');
    if (!p){ info.textContent = ''; tr.style.background = ''; return; }
    const c = productCosting(p), neto = pr * (1 - d / 100), bad = below(neto, c.minimo);
    if (bad) bajoMin++;
    tr.style.background = bad ? 'var(--c-bad-soft)' : '';
    const margenNeg = neto - c.minimo;
    info.innerHTML = `${p.stockRef ? 'Stock: ' + stockDisponible(p.stockRef) + ' · ' : ''}CIPTECH ${usd(p.precio)} · Mínimo <strong style="color:var(--c-bad)">${usd(c.minimo)}</strong> · ${bad ? '<strong style="color:var(--c-bad)">precio bajo el mínimo</strong>' : `<strong style="color:var(--c-ok)">aún puedes bajar ${usd(margenNeg)} (desc. total máx. ${pct(p.precio ? 1 - c.minimo / p.precio : 0)})</strong>`}`;
  });
  const t = cotTotal({items: readLines()});
  const costo = readLines().reduce((s, it) => s + (prodById(it.productoId)?.costo || 0) * it.cant, 0);
  const margen = t.sub ? (t.sub - costo) / t.sub : 0;
  $('#totals').innerHTML = `<div><span>Subtotal (sin IGV)</span><span>${usd(t.sub)}</span></div><div><span>IGV (${db.ajustes.igv * 100}%)</span><span>${usd(t.igv)}</span></div><div class="grand"><span>Total con IGV</span><span>${usd(t.total)}</span></div><div class="muted small"><span>Equivalente en soles (TC ${db.ajustes.tipoCambio})</span><span>${pen(t.total * db.ajustes.tipoCambio)}</span></div><div class="small"><span>Margen bruto estimado</span><span class="badge ${margen < .15 ? 'bad' : margen < .25 ? 'warn' : 'ok'}">${pct(margen)}</span></div>${bajoMin ? `<div class="small"><span class="badge bad" style="white-space:normal">${bajoMin} equipo(s) por debajo del precio mínimo</span></div>` : ''}`;
}

function saveCotizacion(c){
  const form = $('#cotForm'); if (!form.reportValidity()) return false;
  const d = formData(form); const items = readLines();
  if (!items.length){ toast('Agrega al menos un equipo'); return false; }
  const prevEstado = c.estado;
  if (d.estado === 'Ganada' && prevEstado !== 'Ganada') c.fechaCierre = today();
  if (d.estado !== 'Ganada') delete c.fechaCierre;
  Object.assign(c, {numero: d.numero, fecha: d.fecha, validez: +d.validez, estado: d.estado, cliente: d.cliente.trim(), contacto: d.contacto, vendedor: d.vendedor, seguimiento: d.seguimiento, condiciones: d.condiciones, notas: d.notas, items});
  if (!c.id){ c.id = uid(); db.cotizaciones.push(c); db.seq++; }
  // Si el cliente no existe en la cartera, se agrega automáticamente
  if (c.cliente && !db.clientes.some(cl => cl.nombre.toLowerCase() === c.cliente.toLowerCase()))
    db.clientes.push({id: uid(), nombre: c.cliente, clase: 'C', sector: 'Sin sector asignado', grupo: '', ruc: '', contacto: c.contacto, cargo: '', telefono: '', email: '', notas: 'Creado desde cotización ' + c.numero});
  // Al ganar: reservar unidades del stock
  if (c.estado === 'Ganada' && prevEstado !== 'Ganada' && !c.stockReservado){
    const req = items.reduce((n, it) => n + it.cant, 0);
    if (confirm(`¡Venta ganada! ¿Marcar ${req} unidad(es) del inventario como vendidas a ${c.cliente}?`)){
      let faltan = [];
      items.forEach(it => {
        const libres = db.inventario.filter(i => i.stockRef === it.stockRef && i.destino === 'Venta').slice(0, it.cant);
        libres.forEach(i => { i.destino = 'Vendido'; i.usuario = c.cliente; i.obs = (i.obs ? i.obs + ' · ' : '') + 'Venta ' + c.numero; });
        if (libres.length < it.cant) faltan.push(`${it.modelo}: faltan ${it.cant - libres.length}`);
      });
      c.stockReservado = true;
      if (faltan.length) alert('Stock insuficiente:\n' + faltan.join('\n'));
    }
  }
  save(); toast('Cotización guardada'); return true;
}

/* =========================================================
   5b. PLAN DE VENTAS – metas vs. real (vendedor: Maury Ramos)
   ========================================================= */
const PROB_ETAPA = {Prospecto: 0.10, Enviada: 0.30, 'Negociación': 0.60};
const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Set','Oct','Nov','Dic'];
const mesLabel = ym => ym ? MESES[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4) : '';
const esEquipo = it => { const p = prodById(it.productoId); return !(p && String(p.categoria).startsWith('Repuesto')); };
const mesCierre = c => (c.fechaCierre || c.fecha || '').slice(0, 7);

function realDelMes(ym){
  const gan = db.cotizaciones.filter(c => c.estado === 'Ganada' && mesCierre(c) === ym);
  const venta = gan.reduce((s, c) => s + cotTotal(c).sub, 0);
  const costo = gan.reduce((s, c) => s + c.items.reduce((t, it) => t + (prodById(it.productoId) ? productCosting(prodById(it.productoId)).costo : 0) * it.cant, 0), 0);
  return {
    equipos: gan.reduce((s, c) => s + c.items.filter(esEquipo).reduce((t, it) => t + it.cant, 0), 0),
    venta, margen: venta ? (venta - costo) / venta : 0, cierres: gan.length,
    cotizaciones: db.cotizaciones.filter(c => (c.fecha || '').slice(0, 7) === ym).length,
    contactos: (db.actividades || []).filter(a => (a.fecha || '').slice(0, 7) === ym).length
  };
}
function realPorLinea(meses){
  const r = {};
  db.cotizaciones.filter(c => c.estado === 'Ganada' && meses.includes(mesCierre(c))).forEach(c => c.items.forEach(it => {
    const p = prodById(it.productoId); if (!p) return; r[p.categoria] = (r[p.categoria] || 0) + it.cant;
  }));
  return r;
}
const semaforo = (real, meta) => !meta ? 'grey' : real >= meta ? 'ok' : real >= meta * 0.7 ? 'warn' : 'bad';
const barra = (real, meta, cls) => `<div class="bar" title="${pct(meta ? real / meta : 0)}"><span style="width:${Math.min(100, meta ? real / meta * 100 : 0)}%;background:var(--c-${cls === 'ok' ? 'ok' : cls === 'warn' ? 'warn' : cls === 'bad' ? 'bad' : 'primary'})"></span></div>`;

function resumenPlan(){
  const plan = db.plan, ym = today().slice(0, 7);
  const metaMes = plan.meses.find(m => m.mes === ym) || null;
  const meses = plan.meses.map(m => m.mes);
  const realTot = plan.meses.reduce((s, m) => { const r = realDelMes(m.mes); return {equipos: s.equipos + r.equipos, venta: s.venta + r.venta}; }, {equipos: 0, venta: 0});
  const metaTot = plan.meses.reduce((s, m) => ({equipos: s.equipos + (+m.equipos || 0), venta: s.venta + (+m.venta || 0)}), {equipos: 0, venta: 0});
  const ponderado = db.cotizaciones.filter(c => PROB_ETAPA[c.estado]).reduce((s, c) => s + cotTotal(c).sub * PROB_ETAPA[c.estado], 0);
  const inv = db.inventario.filter(i => ['Venta', 'Reservado', 'Vendido'].includes(i.destino));
  const vendidos = inv.filter(i => i.destino === 'Vendido').length;
  return {ym, metaMes, real: realDelMes(ym), meses, realTot, metaTot, ponderado, stockInicial: inv.length, vendidos, pctVendido: inv.length ? vendidos / inv.length : 0};
}

// Descuento promedio máximo para mantener el margen meta, con el mix de stock actual
function descuentoMaxParaMargen(m){
  const stock = db.inventario.filter(i => i.destino === 'Venta').map(i => db.productos.find(p => p.stockRef === i.stockRef)).filter(Boolean);
  const precio = stock.reduce((s, p) => s + p.precio, 0), costo = stock.reduce((s, p) => s + productCosting(p).costo, 0);
  if (!precio) return 0;
  return Math.max(0, 1 - costo / (precio * (1 - m)));
}

let cliBuscar = '', cliClase = '', cliSector = '', cliCorreo = '', cliOrigen = '';
const EMAIL_OK = /^[^\s@;,]+@[^\s@;,]+\.[a-z]{2,}$/i;
const esCipsa = c => /Cliente CIPSA/.test(c.notas || '');
function clientesFiltrados(){
  return db.clientes
    .filter(c => !cliClase || c.clase === cliClase)
    .filter(c => !cliSector || c.sector === cliSector)
    .filter(c => !cliCorreo || (cliCorreo === 'con' ? EMAIL_OK.test(c.email || '') : !EMAIL_OK.test(c.email || '')))
    .filter(c => !cliOrigen || (cliOrigen === 'cipsa' ? esCipsa(c) : !esCipsa(c)))
    .filter(c => !cliBuscar || [c.nombre, c.ruc, c.contacto, c.grupo, c.email].join(' ').toLowerCase().includes(cliBuscar.toLowerCase()))
    .sort((a, b) => a.nombre.localeCompare(b.nombre));
}

/* Mailing: correos de los clientes filtrados, en lotes de 50 para CCO/BCC */
function openMailing(){
  const list = clientesFiltrados().filter(c => EMAIL_OK.test(c.email || ''));
  const vistos = new Set(), uniq = list.filter(c => { const e = c.email.toLowerCase(); if (vistos.has(e)) return false; vistos.add(e); return true; });
  const lotes = []; for (let i = 0; i < uniq.length; i += 50) lotes.push(uniq.slice(i, i + 50));
  const yaEnviados = new Set((db.actividades || []).filter(a => a.tipo === 'Correo' && /Mailing/.test(a.nota || '')).map(a => a.cliente));
  window._lotes = lotes;
  openModal(`Mailing · ${uniq.length} correos en ${lotes.length} lote(s)`, `
  <p class="small" style="margin-top:0">Se usan los clientes del filtro actual de la lista (${list.length} con correo; ${list.length - uniq.length} correos repetidos quitados). Envía cada lote en <strong>CCO / BCC</strong> para que los clientes no vean los correos de los demás y evitar bloqueos por spam.</p>
  <ul class="list">${lotes.map((l, i) => { const env = l.filter(c => yaEnviados.has(c.nombre)).length; return `<li style="flex-wrap:wrap"><span><strong>Lote ${i + 1}</strong> · ${l.length} correos ${env ? `<span class="badge ok">${env} ya enviados</span>` : ''}<div class="small muted">${esc(l.slice(0, 3).map(c => c.nombre).join(', '))}${l.length > 3 ? '…' : ''}</div></span>
    <span class="actions"><button class="btn btn-sm" onclick="copiarLote(${i})">Copiar correos</button><button class="btn btn-sm" onclick="marcarLote(${i})">Marcar como enviado</button></span></li>`; }).join('') || '<li class="muted">No hay clientes con correo en este filtro.</li>'}</ul>
  <p class="small muted">«Marcar como enviado» registra un contacto tipo Correo por cliente, que suma a tu meta de contactos del Plan de ventas.</p>`, [
    {text: 'Descargar lista (CSV)', onClick: () => {
      const rows = [['Empresa','Contacto','Saludo','Correo','Rubro','Teléfono']].concat(uniq.map(c => [c.nombre, c.contacto, c.contacto ? 'Estimado(a) ' + c.contacto.split(' ')[0] : 'Estimados señores', c.email, c.sector, c.telefono]));
      download('mailing_noblelift_' + today() + '.csv', '\ufeff' + rows.map(r => r.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(';')).join('\r\n'), 'text/csv;charset=utf-8');
    }},
    {text: 'Cerrar', cls: 'btn-primary', onClick: closeModal}
  ]);
}
function copiarLote(i){
  const txt = window._lotes[i].map(c => c.email).join('; ');
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast(`Lote ${i + 1} copiado: pégalo en CCO/BCC`)).catch(() => { prompt('Copia los correos del lote:', txt); });
}
function marcarLote(i){
  const l = window._lotes[i];
  if (!confirm(`¿Registrar el envío del lote ${i + 1} (${l.length} clientes) con fecha de hoy?`)) return;
  db.actividades = db.actividades || [];
  l.forEach(c => db.actividades.push({id: uid(), fecha: today(), cliente: c.nombre, tipo: 'Correo', resultado: 'Sin respuesta', nota: 'Mailing Noblelift lote ' + (i + 1)}));
  save(); toast(`Lote ${i + 1} registrado como enviado`); openMailing();
}

    <label>Almacenaje (% FOB)<input type="number" step="0.5" name="alm" value="${+(a.pAlmacen * 100).toFixed(2)}"></label>

    <label>Markup sugerido (%)<input type="number" step="1" name="markup" value="${+(a.markup * 100).toFixed(2)}"></label>

    <label>Cantidad<input type="number" min="1" step="1" name="cant" value="1"></label>
    <label>Precio a ofrecer /u sin IGV (US$)<input type="number" step="0.01" name="oferta"></label>
    <label>o descuento sobre precio CIPTECH (%)<input type="number" step="0.5" name="desc" value="0" oninput="calcFromDesc()"></label>
  </form>
  <div class="grid two-col" style="margin-top:1rem">
    <div class="card" style="box-shadow:none"><h2>Desglose de costo por unidad</h2><ul class="list" id="calcBreak"></ul></div>
    <div class="card" style="box-shadow:none"><h2>Resultado <span class="small muted">(todo sin IGV)</span></h2><ul class="list" id="calcRes"></ul></div>
  </div>`, [
    {text: 'Guardar como precio CIPTECH', onClick: () => { const p = prodById($('#calcForm').prod.value); const v = +$('#calcForm').oferta.value; if (!v) return; p.precio = +v.toFixed(2); save(); toast('Precio CIPTECH actualizado'); router(); }},
    {text: 'Cerrar', cls: 'btn-primary', onClick: closeModal}
  ]);
  calcSelect();
}
function calcSelect(){
  const f = $('#calcForm'), p = prodById(f.prod.value);
  f.sertec.value = (+(p.sertecU || 0)).toFixed(2); f.oferta.value = (+p.precio).toFixed(2); f.desc.value = 0;
  f.sertec.disabled = !p.costoReal;
  calcUpdate();
}
function calcFromDesc(){
  const f = $('#calcForm'), p = prodById(f.prod.value);
  f.oferta.value = (p.precio * (1 - (+f.desc.value || 0) / 100)).toFixed(2); calcUpdate(true);
}
function calcUpdate(fromDesc){
  const f = $('#calcForm'); if (!f) return;
  const p = prodById(f.prod.value), a = db.ajustes;
  const ov = {pAlmacen: (+f.alm.value || 0) / 100, pMkt: (+f.mkt.value || 0) / 100, markup: (+f.markup.value || 0) / 100, margenMin: (+f.minm.value || 0) / 100, sertecU: +f.sertec.value || 0};
  const c = productCosting(p, db, ov), q = +f.cant.value || 1, of = +f.oferta.value || 0;
  if (!fromDesc && p.precio) f.desc.value = (+((1 - of / p.precio) * 100).toFixed(2));
  const li = (l, v, cls = '') => `<li><span>${l}</span><span class="${cls}">${v}</span></li>`;
  $('#calcBreak').innerHTML = c.real
    ? li('FOB Shanghai', usd(p.fob)) + li('Importación real (flete, seguro, aduana)', usd(c.real - p.fob)) + li('<strong>Costo real puesto en Lima</strong>', `<strong>${usd(c.real)}</strong>`) + li('Almacenaje', usd(c.alm)) + li('MKT + ADM', usd(c.mkt)) + li('SERTEC', usd(c.sertecU)) + li('<strong>Costo total</strong>', `<strong>${usd(c.costo)}</strong>`)
    : li('FOB Shanghai', usd(p.fob)) + li('<strong>Costo total (estimado o manual)</strong>', `<strong>${usd(c.costo)}</strong>`) + '<li class="small muted">Este equipo aún no tiene costo real de importación; se usa el costo del catálogo o la estimación con % de Ajustes.</li>';
  const margen = of - c.costo, mpct = of ? margen / of : 0, st = below(of, c.minimo) ? 'bad' : below(of, c.sugerido) ? 'warn' : 'ok';
  const maxDesc = p.precio ? Math.max(0, 1 - c.minimo / p.precio) : 0;
  $('#calcRes').innerHTML =
    li('<strong>PRECIO MÍNIMO /u</strong>', `<strong style="color:var(--c-bad)">${usd(c.minimo)}</strong>`) +
    li('Precio sugerido /u', usd(c.sugerido)) +
    li('Precio CIPTECH (sin IGV)', usd(p.precio)) +
    li('<strong>Puedes bajar hasta</strong>', `<strong style="color:var(--c-ok)">${usd(Math.max(0, p.precio - c.minimo))} · desc. máx. ${pct(maxDesc)}</strong>`) +
    li('Tu oferta /u (sin IGV)', `<strong>${usd(of)}</strong>`) +
    li(`Margen (${q} und.)`, `<span class="badge ${st}">${usd(margen * q)} · ${pct(mpct)}</span>`) +
    li(`Total oferta sin IGV (${q} und.)`, `${usd(of * q)} · ${pen(of * q * a.tipoCambio)}`) +
    `<li><span class="badge ${st}" style="white-space:normal">${st === 'bad' ? 'Por debajo del mínimo: con este precio pierdes ' + usd((c.minimo - of) * q) : st === 'warn' ? 'Sobre el mínimo, pero debajo del sugerido' : 'Precio sano: igual o mayor al sugerido'}</span></li>`;
}

/* =========================================================
   10b. BATERÍAS – control de carga mensual (equipos en almacén + backups)
   Recomendación: cargar cada batería al menos 1 vez al mes.
   ========================================================= */
const BAT_SPEC = {
  'FE4P20Q':'Litio 48V/200Ah', 'PTE15N':'Litio 24V/20Ah', 'PTE15Q2-B':'Litio 24V/20Ah', 'PT20Q2-B':'Litio 48V/20Ah',
  'PT20L-Li':'Litio 24V/150Ah', 'PT20N':'Litio 24V/150Ah', 'PS16L':'Litio 24V/150Ah', 'PS20L':'Litio 24V/150Ah',
  'PS16N':'Litio 24V/150Ah', 'PS20N':'Litio 24V/150Ah', 'SC12E':'Batería de tracción (ver ficha)', 'MES150':'Batería (por confirmar)'
};
const AVISO_DIAS = 7; // alerta cuando faltan 7 días o menos

function listaBaterias(){
  const a = db.ajustes, reg = db.baterias || {};
  const eq = db.inventario
    .filter(i => BAT_SPEC[i.modelo] && i.destino !== 'Vendido' && !String(i.estado).startsWith('6'))
    .map(i => ({key: 'EQ:' + i.id, id: 'BAT-' + i.id, tipo: 'Equipo', unidad: i.id, modelo: i.modelo, spec: BAT_SPEC[i.modelo], ubicacion: i.ubicacion}));
  const bk = (db.backups || []).map(b => ({key: 'BK:' + b.id, id: b.id, tipo: 'Backup', unidad: '—', modelo: b.modelo, spec: b.spec, ubicacion: b.ubicacion, obs: b.obs}));
  return [...eq, ...bk].map(b => {
    const r = reg[b.key] || {};
    const ultima = r.ultima || a.fechaLlegada;
    const proxima = addDays(ultima, +a.cargaDias || 30);
    const dias = daysBetween(today(), proxima);
    const est = dias < 0 ? {txt: 'Vencida', cls: 'bad'} : dias <= AVISO_DIAS ? {txt: 'Cargar pronto', cls: 'warn'} : {txt: 'Al día', cls: 'ok'};
    return {...b, ultima, proxima, dias, est, resp: r.resp || '', historial: r.historial || [], sinRegistro: !r.ultima};
  });
}
const alertaBaterias = () => { const l = listaBaterias(); return {vencidas: l.filter(b => b.est.txt === 'Vencida').length, pronto: l.filter(b => b.est.txt === 'Cargar pronto').length, total: l.length, proxima: l.reduce((m, b) => !m || b.proxima < m ? b.proxima : m, '')}; };

/* Marca de alerta en el menú */
function badgeBaterias(){
  const a = alertaBaterias(), n = a.vencidas + a.pronto, link = $('#nav a[data-route="baterias"]');
  if (!link) return;
  link.querySelector('.nav-badge')?.remove();
  if (n) link.insertAdjacentHTML('beforeend', `<span class="nav-badge ${a.vencidas ? 'bad' : 'warn'}" title="${a.vencidas} vencidas · ${a.pronto} por cargar">${n}</span>`);
}
/* Banner de alerta (se muestra en el panel y en la página de baterías) */
function bannerBaterias(){
  const a = alertaBaterias();
  if (a.vencidas) return `<div class="alert bad" role="alert"><strong>⚠ ${a.vencidas} batería(s) con carga VENCIDA</strong>${a.pronto ? ` y ${a.pronto} por cargar en ${AVISO_DIAS} días o menos` : ''}. Las baterías de litio deben cargarse al menos 1 vez al mes. <a href="#baterias">Ver baterías →</a></div>`;
  if (a.pronto) return `<div class="alert warn" role="alert"><strong>🔋 ${a.pronto} batería(s) deben cargarse en los próximos ${AVISO_DIAS} días.</strong> <a href="#baterias">Ver baterías →</a></div>`;
  return '';
}

function cargarSeleccion(){
  const keys = $$('.bat-sel:checked').map(c => c.value);
  if (!keys.length) return toast('Selecciona una o más baterías de la tabla');
  registrarCarga(keys);
}
function registrarCarga(keys){
  const all = listaBaterias(), sel = all.filter(b => keys.includes(b.key));
  const hist = sel.length === 1 ? sel[0].historial : [];
  openModal(sel.length === 1 ? 'Registrar carga · ' + sel[0].id : `Registrar carga de ${sel.length} baterías`, `
  ${sel.length === 1 ? `<p class="small" style="margin-top:0">${esc(sel[0].modelo)} · ${esc(sel[0].spec)} · ${esc(sel[0].ubicacion)} · próxima carga ${fmtDate(sel[0].proxima)} <span class="badge ${sel[0].est.cls}">${sel[0].est.txt}</span></p>` : `<p class="small" style="margin-top:0">${sel.map(b => esc(b.id)).join(', ')}</p>`}
  <form class="form" id="cargaForm">
    <label>Fecha de carga<input type="date" name="fecha" value="${today()}" max="${today()}" required></label>
    <label>Responsable<input name="resp" value="${esc(db.ajustes.vendedor)}"></label>
    <label>Nivel al terminar (%)<input type="number" name="nivel" min="0" max="100" value="100"></label>
    <label class="full">Observación<input name="obs" placeholder="Ej.: carga completa, sin alarmas"></label>
  </form>
  ${hist.length ? `<div class="section-title" style="margin-top:1rem">Historial de cargas</div><ul class="list">${hist.map(h => `<li><span>${fmtDate(h.fecha)} · ${esc(h.resp)} ${h.obs ? '· ' + esc(h.obs) : ''}</span><span class="small">${h.nivel ? h.nivel + ' %' : ''}</span></li>`).join('')}</ul>` : ''}`, [
    {text: 'Cancelar', onClick: closeModal},
    {text: 'Guardar carga', cls: 'btn-primary', onClick: () => {
      const f = $('#cargaForm'); if (!f.reportValidity()) return;
      const d = formData(f); db.baterias = db.baterias || {};
      keys.forEach(k => { const r = db.baterias[k] || (db.baterias[k] = {historial: []}); r.ultima = d.fecha; r.resp = d.resp; r.historial.unshift(d); });
      save(); closeModal(); router(); toast(`Carga registrada (${keys.length}) · próxima: ${fmtDate(addDays(d.fecha, +db.ajustes.cargaDias || 30))}`);
    }}
  ]);
}

function saveAjustes(){
  const d = formData($('#ajForm'));
  Object.keys(d).forEach(k => { db.ajustes[k] = ['empresa','ruc','telefono','direccion','email','vendedor','condiciones','fechaLlegada'].includes(k) ? d[k] : +d[k]; });
  applyCosteo(); save(); toast('Ajustes guardados');
}
function download(name, content, type){
  const blob = content instanceof Blob ? content : new Blob([content], {type}); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const exportData = () => download('respaldo_ventas_noblelift_' + today() + '.json', JSON.stringify(db, null, 2), 'application/json');
function importData(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d.productos || !d.clientes) throw new Error('formato no válido'); db = d; save(); router(); toast('Respaldo importado'); } catch(e){ alert('No se pudo importar: ' + e.message); } };
  r.readAsText(file);
}
function exportCSV(kind){
  let rows;

   12. EXCEL (.xlsx): importar y exportar sin librerías externas
   El .xlsx es un ZIP de archivos XML; aquí se lee y se escribe directamente.
   ========================================================= */
const XL_SHEETS = {
  CLIENTES: ['Razón social','RUC','Clase','Sector','Grupo económico','Contacto','Cargo','Teléfono','Correo','Notas'],
  CATALOGO: ['Código','Modelo','Categoría','Especificaciones','Ref. inventario','FOB Shanghai (US$)','Costo final (US$)','Precio CIPTECH sin IGV (US$)'],
  COSTEO_REAL: ['Código 16789','Descripción','Tipo','Código catálogo','Unidades','FOB total (US$)','Flete total (US$)','Seguro total (US$)','Ad-valorem total (US$)','Gastos aduana total (US$)'],
  COTIZACIONES: ['N.° cotización','Fecha','Cliente','Contacto','Vendedor','Estado','Validez (días)','Próximo seguimiento','Condiciones','Notas','Fecha de cierre'],
  COT_DETALLE: ['N.° cotización','Código equipo','Cantidad','Precio unit. (US$)','Desc. %'],
  INVENTARIO: ['ID','Modelo','Categoría','Estabilizadores','Descripción','Ubicación','Estado','Destino','Cliente / usuario','N.° serie','Contenedor','Fecha entrega','Observaciones'],
  FLOTA_MP: ['Código','Descripción','Modelo','N.° serie','Cliente','Área / ubicación','Status','Último MP','Próximo MP','Correctivos 2026','Observación'],
  SERVICIOS: ['Código equipo','Tipo','Fecha','N.° requerimiento','Técnico(s)','Status del equipo','Trabajo realizado / repuestos'],
  BATERIAS: ['ID batería','Tipo','ID unidad','Modelo','Batería','Ubicación','Última carga','Responsable','Observación'],

/* ---- Lectura del ZIP ---- */
async function unzip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder();
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  if (eocd < 0) throw new Error('el archivo no es un .xlsx válido');
  const count = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const files = {};
  for (let k = 0; k < count; k++){
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
    const start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
    files[name] = {method, data: u8.subarray(start, start + csize)};
    p += 46 + nlen + elen + clen;
  }
  return async name => {
    const f = files[name]; if (!f) return null;
    if (f.method === 0) return dec.decode(f.data);
    const stream = new Blob([f.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return await new Response(stream).text();
  };
}
const xmlDoc = s => new DOMParser().parseFromString(s, 'application/xml');
const tags = (node, name) => [...node.getElementsByTagNameNS('*', name)];
const colIndex = ref => { let n = 0; for (const ch of ref.replace(/\d+/g, '')) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };

async function readXlsx(file){
  const get = await unzip(await file.arrayBuffer());
  const wbx = xmlDoc(await get('xl/workbook.xml'));
  const rels = xmlDoc(await get('xl/_rels/workbook.xml.rels'));
  const relMap = Object.fromEntries(tags(rels, 'Relationship').map(r => [r.getAttribute('Id'), r.getAttribute('Target')]));
  const ssXml = await get('xl/sharedStrings.xml');
  const shared = ssXml ? tags(xmlDoc(ssXml), 'si').map(si => tags(si, 't').map(t => t.textContent).join('')) : [];
  const out = {};
  for (const sh of tags(wbx, 'sheet')){
    const name = sh.getAttribute('name');
    if (!XL_SHEETS[name]) continue;
    const rid = [...sh.attributes].find(a => a.localName === 'id' && a.name !== 'sheetId').value;
    let target = relMap[rid]; target = target.startsWith('/') ? target.slice(1) : 'xl/' + target;
    const doc = xmlDoc(await get(target));
    const rows = [];
    for (const row of tags(doc, 'row')){
      const r = []; let any = false;
      for (const c of tags(row, 'c')){
        const t = c.getAttribute('t'), v = tags(c, 'v')[0]?.textContent;
        let val = null;
        if (t === 's') val = shared[+v];
        else if (t === 'inlineStr') val = tags(c, 't').map(x => x.textContent).join('');
        else if (t === 'str' || t === 'e') val = t === 'e' ? null : v;
        else if (t === 'b') val = v === '1';
        else if (v != null && v !== '') val = Number(v);
        if (val !== null && val !== '') any = true;
        r[colIndex(c.getAttribute('r'))] = val;
      }
      rows[+row.getAttribute('r') - 1] = any ? r : null;
    }
    // La fila de encabezados es la que contiene el primer título esperado (en COSTEO_REAL no es la fila 1)
    let hi = rows.findIndex(r => r && r.some(v => String(v ?? '').trim() === XL_SHEETS[name][0]));
    if (hi < 0) hi = 0;
    const header = (rows[hi] || []).map(h => String(h ?? '').trim());
    out[name] = rows.slice(hi + 1).filter(Boolean).map(r => Object.fromEntries(header.map((h, j) => [h, r[j] ?? ''])))
      .filter(o => Object.entries(o).some(([h, v]) => !h.includes('(calc)') && v !== '' && v !== null));
  }
  return out;
}

/* Conversión de valores leídos */
const xlStr = v => (v === null || v === undefined) ? '' : String(v).trim();
const xlNum = v => { if (v === '' || v == null) return 0; if (typeof v === 'number') return v; const n = parseFloat(String(v).replace(/[^\d.,-]/g, '').replace(',', '.')); return isNaN(n) ? 0 : n; };
function xlDate(v){
  if (v === '' || v == null) return '';
  if (typeof v === 'number') return new Date(Math.round((v - 25569) * 86400000)).toISOString().slice(0, 10);
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/))) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[0];
  return '';
}
const xlPct100 = v => { if (v === '' || v == null) return 0; const s = String(v); const n = xlNum(v); return s.includes('%') ? n : (n <= 1 ? n * 100 : n); };

/* ---- Importar: cada hoja con datos reemplaza su módulo ---- */
async function importExcel(file){
  if (!file) return;
  if (!('DecompressionStream' in window)) return alert('Tu navegador no permite leer Excel. Usa Chrome o Edge actualizados.');
  let x;
  try { x = await readXlsx(file); } catch(e){ return alert('No se pudo leer el Excel: ' + e.message); }
  const plan = [], warn = [];
  const next = {};

  if (x.CLIENTES?.length){
    next.clientes = x.CLIENTES.filter(r => xlStr(r['Razón social'])).map(r => ({id: uid(), nombre: xlStr(r['Razón social']), ruc: xlStr(r['RUC']), clase: xlStr(r['Clase']) || 'C', sector: xlStr(r['Sector']), grupo: xlStr(r['Grupo económico']), contacto: xlStr(r['Contacto']), cargo: xlStr(r['Cargo']), telefono: xlStr(r['Teléfono']), email: xlStr(r['Correo']), notas: xlStr(r['Notas'])}));
    plan.push(`Clientes: ${next.clientes.length}`);
  }
  if (x.CATALOGO?.length){
    next.productos = x.CATALOGO.filter(r => xlStr(r['Código'])).map(r => {
      const codigo = xlStr(r['Código']); const prev = db.productos.find(p => p.codigo === codigo);
      return {id: prev ? prev.id : uid(), codigo, modelo: xlStr(r['Modelo']) || codigo, categoria: xlStr(r['Categoría']), specs: xlStr(r['Especificaciones']), stockRef: xlStr(r['Ref. inventario']), fob: xlNum(r['FOB Shanghai (US$)']), costo: xlNum(r['Costo final (US$)']), precio: xlNum(r['Precio CIPTECH sin IGV (US$)'] !== undefined ? r['Precio CIPTECH sin IGV (US$)'] : r['Precio venta (US$)'])};
    });
    plan.push(`Catálogo: ${next.productos.length} equipos`);
  }
  if (x.COSTEO_REAL?.length){
    next.costeo = x.COSTEO_REAL.filter(r => xlNum(r['Unidades']) > 0 && (xlStr(r['Descripción']) || xlStr(r['Código catálogo']))).map(r => ({
      cod: xlStr(r['Código 16789']), desc: xlStr(r['Descripción']), tipo: ['Equipo','Repuesto','Activo fijo'].includes(xlStr(r['Tipo'])) ? xlStr(r['Tipo']) : 'Equipo',
      codigoCat: xlStr(r['Código catálogo']), unidades: xlNum(r['Unidades']), fobT: xlNum(r['FOB total (US$)']), fleteT: xlNum(r['Flete total (US$)']),
      seguroT: xlNum(r['Seguro total (US$)']), advT: xlNum(r['Ad-valorem total (US$)']), gastosT: xlNum(r['Gastos aduana total (US$)'])}));
    const cat = next.productos || db.productos;
    next.costeo.filter(r => r.codigoCat && r.tipo !== 'Activo fijo' && !cat.some(p => p.codigo === r.codigoCat)).forEach(r => {
      if (!next.productos) next.productos = db.productos.slice();
      if (!next.productos.some(p => p.codigo === r.codigoCat)) next.productos.push({id: uid(), codigo: r.codigoCat, modelo: r.desc || r.codigoCat, categoria: r.tipo === 'Repuesto' ? 'Repuesto' : 'Equipo nuevo', specs: r.desc, fob: r.unidades ? r.fobT / r.unidades : 0, costo: 0, precio: 0, stockRef: ''});
    });
    plan.push(`Costeo real: ${next.costeo.length} ítems de importación`);
  }
  const catalogo = next.productos || db.productos;
  const cotRows = (x.COTIZACIONES || []).filter(r => xlStr(r['N.° cotización']) && !/EJEMPLO/i.test(r['N.° cotización']));
  if (cotRows.length){
    const det = (x.COT_DETALLE || []).filter(r => xlStr(r['N.° cotización']) && !/EJEMPLO/i.test(r['N.° cotización']));
    let sinCodigo = 0;
    next.cotizaciones = cotRows.map(r => {
      const numero = xlStr(r['N.° cotización']);
      const items = det.filter(d => xlStr(d['N.° cotización']) === numero).map(d => {
        const p = catalogo.find(p => p.codigo === xlStr(d['Código equipo']));
        if (!p){ sinCodigo++; return null; }
        return {productoId: p.id, modelo: p.modelo, specs: p.specs, stockRef: p.stockRef, cant: xlNum(d['Cantidad']) || 1, precio: d['Precio unit. (US$)'] === '' ? p.precio : xlNum(d['Precio unit. (US$)']), desc: xlPct100(d['Desc. %'])};
      }).filter(Boolean);
      const estado = ETAPAS.includes(xlStr(r['Estado'])) ? xlStr(r['Estado']) : 'Prospecto';
      return {id: uid(), numero, fecha: xlDate(r['Fecha']) || today(), cliente: xlStr(r['Cliente']), contacto: xlStr(r['Contacto']), vendedor: xlStr(r['Vendedor']) || db.ajustes.vendedor, estado,
        validez: xlNum(r['Validez (días)']) || 15, seguimiento: xlDate(r['Próximo seguimiento']), condiciones: xlStr(r['Condiciones']) || db.ajustes.condiciones, notas: xlStr(r['Notas']), items, stockReservado: estado === 'Ganada', ...(estado === 'Ganada' ? {fechaCierre: xlDate(r['Fecha de cierre']) || xlDate(r['Fecha']) || today()} : {})};
    });
    if (sinCodigo) warn.push(`${sinCodigo} línea(s) de COT_DETALLE con código que no existe en el catálogo (se omitieron).`);
    const sinLineas = next.cotizaciones.filter(c => !c.items.length).length;
    if (sinLineas) warn.push(`${sinLineas} cotización(es) sin equipos en COT_DETALLE.`);
    plan.push(`Cotizaciones: ${next.cotizaciones.length}`);
  }
  if (x.INVENTARIO?.length){
    next.inventario = x.INVENTARIO.filter(r => xlStr(r['ID'])).map(r => {
      const estabiliz = xlStr(r['Estabilizadores']) || '—', modelo = xlStr(r['Modelo']);
      return {id: xlStr(r['ID']), modelo, categoria: xlStr(r['Categoría']), estabiliz, descripcion: xlStr(r['Descripción']), ubicacion: xlStr(r['Ubicación']), estado: xlStr(r['Estado']) || '1. Por revisar', destino: xlStr(r['Destino']) || 'Venta', usuario: xlStr(r['Cliente / usuario']), serie: xlStr(r['N.° serie']), contenedor: xlStr(r['Contenedor']), fechaEntrega: xlDate(r['Fecha entrega']), obs: xlStr(r['Observaciones']), stockRef: modelo + '|' + (['Con', 'Sin'].includes(estabiliz) ? estabiliz : '')};
    });
    plan.push(`Inventario: ${next.inventario.length} unidades`);
  }
  if (x.FLOTA_MP?.length){
    next.flota = x.FLOTA_MP.filter(r => xlStr(r['Código'])).map(r => {
      const ultimoMP = xlDate(r['Último MP']);
      return {id: uid(), codigo: xlStr(r['Código']), descripcion: xlStr(r['Descripción']), modelo: xlStr(r['Modelo']), serie: xlStr(r['N.° serie']), cliente: xlStr(r['Cliente']), area: xlStr(r['Área / ubicación']), estado: xlStr(r['Status']) || 'Operativo', ultimoMP, proximoMP: xlDate(r['Próximo MP']) || (ultimoMP ? addMonths(ultimoMP, db.ajustes.freqMP) : ''), correctivos: xlNum(r['Correctivos 2026']), obs: xlStr(r['Observación']), historial: []};
    });
    plan.push(`Flota MP: ${next.flota.length} equipos`);
  }
  if (x.SERVICIOS?.length){
    const flota = next.flota || db.flota.map(f => ({...f, historial: []}));
    let n = 0, huerfanos = 0;
    x.SERVICIOS.filter(r => xlStr(r['Código equipo'])).forEach(r => {
      const f = flota.find(f => f.codigo === xlStr(r['Código equipo']));
      if (!f){ huerfanos++; return; }
      f.historial.push({tipo: xlStr(r['Tipo']) || 'PREVENTIVO', fecha: xlDate(r['Fecha']), req: xlStr(r['N.° requerimiento']), tecnico: xlStr(r['Técnico(s)']), estado: xlStr(r['Status del equipo']), obs: xlStr(r['Trabajo realizado / repuestos'])}); n++;
    });
    flota.forEach(f => {
      f.historial.sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
      // Un preventivo más reciente que «Último MP» actualiza la programación
      const mp = f.historial.find(h => h.tipo === 'PREVENTIVO' && h.fecha);
      if (mp && mp.fecha > (f.ultimoMP || '')){ f.ultimoMP = mp.fecha; f.proximoMP = addMonths(mp.fecha, db.ajustes.freqMP); }
    });
    next.flota = flota;
    if (huerfanos) warn.push(`${huerfanos} servicio(s) con código que no está en FLOTA_MP (se omitieron).`);
    plan.push(`Servicios: ${n} registros`);
  }
  if (x.AJUSTES?.length){
    const aj = {...db.ajustes}; let n = 0;
    x.AJUSTES.forEach(r => { const k = xlStr(r['Clave']); if (k in aj && r['Valor'] !== ''){ aj[k] = k === 'fechaLlegada' ? (xlDate(r['Valor']) || aj[k]) : typeof db.ajustes[k] === 'number' ? xlNum(r['Valor']) : xlStr(r['Valor']); n++; } });
    next.ajustes = aj; plan.push(`Ajustes: ${n} parámetros`);
  }
  if (x.PLAN_VENTAS?.length){
    const meses = x.PLAN_VENTAS.map(r => ({mes: xlDate(r['Mes']).slice(0, 7), equipos: xlNum(r['Meta equipos']), venta: xlNum(r['Meta venta (US$)']), cotizaciones: xlNum(r['Meta cotizaciones']), contactos: xlNum(r['Meta contactos']), nota: xlStr(r['Nota'])})).filter(m => m.mes).sort((a, b) => a.mes.localeCompare(b.mes));
    if (meses.length){ next.plan = {...(db.plan || PLAN_INICIAL()), meses}; plan.push(`Plan de ventas: ${meses.length} meses`); }
  }
  if (x.PLAN_LINEAS?.length){
    const lineas = x.PLAN_LINEAS.filter(r => xlStr(r['Línea'])).map(r => ({linea: xlStr(r['Línea']), meta: xlNum(r['Meta equipos (periodo)'])}));
    if (lineas.length){ next.plan = {...(next.plan || db.plan || PLAN_INICIAL()), lineas}; plan.push(`Metas por línea: ${lineas.length}`); }
  }
  if (x.ACTIVIDADES?.length){
    next.actividades = x.ACTIVIDADES.filter(r => xlDate(r['Fecha']) && xlStr(r['Cliente'])).map(r => ({id: uid(), fecha: xlDate(r['Fecha']), cliente: xlStr(r['Cliente']), tipo: xlStr(r['Tipo']) || 'Llamada', resultado: xlStr(r['Resultado']), nota: xlStr(r['Nota'])}));
    plan.push(`Contactos: ${next.actividades.length}`);
  }
  if (x.BATERIAS?.length){
    const rows = x.BATERIAS.filter(r => xlStr(r['ID batería']));
    const bks = rows.filter(r => xlStr(r['Tipo']) === 'Backup');
    if (bks.length) next.backups = bks.map(r => ({id: xlStr(r['ID batería']), modelo: xlStr(r['Modelo']), spec: xlStr(r['Batería']), ubicacion: xlStr(r['Ubicación']) || 'CIPSA (Frutales)', obs: xlStr(r['Observación'])}));
    const reg = JSON.parse(JSON.stringify(db.baterias || {}));
    let n = 0;
    rows.forEach(r => {
      const f = xlDate(r['Última carga']); if (!f) return;
      const key = xlStr(r['Tipo']) === 'Backup' ? 'BK:' + xlStr(r['ID batería']) : 'EQ:' + xlStr(r['ID unidad']);
      const e = reg[key] || (reg[key] = {historial: []});
      if (e.ultima !== f){ e.ultima = f; e.resp = xlStr(r['Responsable']); e.historial.unshift({fecha: f, resp: e.resp, obs: xlStr(r['Observación']) || 'Importado de Excel', nivel: ''}); n++; }
    });
    next.baterias = reg;
    plan.push(`Baterías: ${rows.length} (${n} cargas nuevas${bks.length ? ', ' + bks.length + ' backups' : ''})`);
  }
  if (!plan.length) return alert('No encontré datos en las hojas del Excel (revisa que los nombres de hojas y encabezados no hayan cambiado).');
  if (!confirm('Se reemplazarán estos módulos con los datos del Excel:\n\n• ' + plan.join('\n• ') + (warn.length ? '\n\nAvisos:\n• ' + warn.join('\n• ') : '') + '\n\nTe recomiendo descargar antes un respaldo. ¿Continuar?')) return;
  Object.assign(db, next);
  applyCosteo();
  // Clientes mencionados en cotizaciones que no estén en la cartera
  db.cotizaciones.forEach(c => { if (c.cliente && !db.clientes.some(cl => cl.nombre.toLowerCase() === c.cliente.toLowerCase())) db.clientes.push({id: uid(), nombre: c.cliente, clase: 'C', sector: 'Sin sector asignado', grupo: '', ruc: '', contacto: c.contacto, cargo: '', telefono: '', email: '', notas: 'Creado al importar ' + c.numero}); });
  const nums = db.cotizaciones.map(c => parseInt((c.numero.match(/(\d+)\s*$/) || [])[1], 10)).filter(n => !isNaN(n));
  db.seq = Math.max(db.seq || 1, nums.length ? Math.max(...nums) + 1 : 1);
  save(); router(); toast('Sistema actualizado desde Excel');
}

/* ---- Exportar: genera el mismo formato de hojas con los datos actuales ---- */
const crcTable = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = u8 => { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = crcTable[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function zipStore(files){ // files: [[nombre, texto]] sin compresión
  const enc = new TextEncoder(), parts = [], central = []; let offset = 0;
  for (const [name, text] of files){
    const nb = enc.encode(name), data = enc.encode(text), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, nb.length, true);
    parts.push(lh, nb, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, nb.length, true); ch.setUint32(42, offset, true);
    central.push(ch, nb);
    offset += 30 + nb.length + data.length;

  const csize = central.reduce((s, p) => s + p.byteLength, 0);

  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, csize, true); end.setUint32(16, offset, true);

const xmlEsc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
const colLetter = i => { let s = ''; i++; while (i > 0){ const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
const isoToSerial = d => (Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)) / 86400000) + 25569;

function sheetXml(header, rows){
  const cell = (v, ref, isDate, s) => {
    if (v === '' || v == null) return '';
    if (isDate && /^\d{4}-\d{2}-\d{2}$/.test(v)) return `<c r="${ref}" s="2"><v>${isoToSerial(v)}</v></c>`;
    if (typeof v === 'number' && isFinite(v)) return `<c r="${ref}"${s ? ` s="${s}"` : ''}><v>${v}</v></c>`;
    return `<c r="${ref}" t="inlineStr"${s ? ` s="${s}"` : ''}><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
  };
  const all = [header, ...rows];
  const body = all.map((r, i) => `<row r="${i + 1}">${r.map((v, j) => cell(v, colLetter(j) + (i + 1), i > 0 && XL_DATE_COLS.has(header[j]), i === 0 ? 1 : 0)).join('')}</row>`).join('');
  const cols = header.map((h, j) => `<col min="${j + 1}" max="${j + 1}" width="${Math.min(50, Math.max(12, h.length + 4))}" customWidth="1"/>`).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${cols}</cols><sheetData>${body}</sheetData><autoFilter ref="A1:${colLetter(header.length - 1)}${Math.max(2, all.length)}"/></worksheet>`;
}
